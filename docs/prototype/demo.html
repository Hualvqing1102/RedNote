<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RedNote · 本地学习笔记</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3F3ED;
    --surface:#FBFBF6;
    --ink:#20261F;
    --muted:#6B7265;
    --line:#DDDED2;
    --green:#2E6B4C;
    --green-deep:#1F4D36;
    --highlight:#E9E24B;
    --kraft:#C7B98A;
    --shadow:0 1px 2px rgba(32,38,31,.05), 0 8px 24px rgba(32,38,31,.06);
    --radius:10px;
    --sans:'IBM Plex Sans',-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;
    --serif:'Fraunces',Georgia,'Songti SC',serif;
    --mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans);
    color:var(--ink);
    background:var(--paper);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea{font-family:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:4px}

  /* ---------- App shell ---------- */
  .app{display:grid;grid-template-columns:224px 1fr;height:100vh;overflow:hidden}

  /* ---------- Sidebar ---------- */
  .sidebar{
    display:flex;flex-direction:column;
    border-right:1px solid var(--line);
    background:var(--surface);
    padding:20px 14px;
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    padding:4px 10px 18px;
    border-bottom:1px solid var(--line);
    margin-bottom:14px;
  }
  .brand-mark{
    width:30px;height:30px;border-radius:7px;
    background:var(--green);
    color:var(--surface);
    display:grid;place-items:center;
    font-family:var(--serif);font-size:17px;font-weight:600;
  }
  .brand-name{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.5px}
  .brand-sub{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.4px}

  .nav{display:flex;flex-direction:column;gap:2px}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:9px 10px;border-radius:8px;
    font-size:14px;color:var(--muted);
    transition:background .12s,color .12s;
    text-align:left;width:100%;
  }
  .nav-item:hover{background:rgba(46,107,76,.07);color:var(--ink)}
  .nav-item.active{background:var(--green);color:#fff}
  .nav-item svg{width:18px;height:18px;flex:none}
  .nav-item .count{margin-left:auto;font-family:var(--mono);font-size:11px;opacity:.75}

  .sidebar-foot{
    margin-top:auto;padding:12px 10px 0;
    border-top:1px solid var(--line);
    font-family:var(--mono);font-size:10.5px;color:var(--muted);line-height:1.7;
  }
  .sidebar-foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px}

  /* ---------- Main ---------- */
  .main{display:flex;flex-direction:column;min-width:0}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:16px 28px;
    border-bottom:1px solid var(--line);
    background:var(--paper);
  }
  .topbar h1{font-family:var(--serif);font-size:22px;font-weight:600}
  .topbar .crumb{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.3px}
  .topbar-actions{display:flex;gap:10px;align-items:center}

  .view{flex:1;overflow-y:auto;padding:28px;display:none}
  .view.active{display:block}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:7px;
    padding:9px 16px;border-radius:8px;
    font-size:13.5px;font-weight:500;
    border:1px solid transparent;
    transition:background .12s,border-color .12s,transform .05s;
  }
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--green);color:#fff}
  .btn-primary:hover{background:var(--green-deep)}
  .btn-ghost{border-color:var(--line);color:var(--ink);background:var(--surface)}
  .btn-ghost:hover{border-color:var(--muted)}
  .btn-sm{padding:6px 12px;font-size:12.5px}
  .btn[disabled]{opacity:.5;cursor:not-allowed}

  /* ---------- Collect view ---------- */
  .collect-wrap{max-width:860px;margin:0 auto}
  .collect-hero{padding:34px 0 22px}
  .collect-hero .eyebrow{font-family:var(--mono);font-size:11px;color:var(--green);letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px}
  .collect-hero h2{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.25;margin-bottom:10px}
  .collect-hero p{color:var(--muted);font-size:14.5px;line-height:1.6;max-width:560px}

  .urlbar{
    display:flex;gap:10px;align-items:stretch;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:6px;box-shadow:var(--shadow);
  }
  .urlbar input{
    flex:1;border:none;background:transparent;padding:9px 12px;font-size:14px;
  }
  .urlbar input:focus{outline:none}
  .examples{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .example-chip{
    font-family:var(--mono);font-size:11.5px;color:var(--muted);
    border:1px dashed var(--line);border-radius:20px;padding:5px 12px;
    transition:border-color .12s,color .12s;
  }
  .example-chip:hover{border-color:var(--green);color:var(--green)}

  /* staged loading */
  .collect-stages{margin-top:26px;display:none}
  .collect-stages.visible{display:block}
  .stage{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px dashed var(--line)}
  .stage:last-child{border-bottom:none}
  .stage .spinner,.stage .check{
    width:20px;height:20px;flex:none;display:grid;place-items:center;
  }
  .stage .spinner{border:2px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite}
  .stage.done .spinner{display:none}
  .stage .check{display:none;color:var(--green)}
  .stage.done .check{display:grid}
  .stage .t{font-size:14px}
  .stage .d{font-family:var(--mono);font-size:11px;color:var(--muted)}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* result */
  .collect-result{margin-top:22px;display:none}
  .collect-result.visible{display:block}
  .result-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
  @media (max-width:820px){.result-grid{grid-template-columns:1fr}}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .panel-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
  .panel-head .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.6px;color:var(--muted);text-transform:uppercase}
  .panel-body{padding:18px}

  .article{margin-left:18px;padding-left:16px;border-left:2px solid var(--kraft);position:relative}
  .article::before{content:"";position:absolute;left:-30px;top:0;bottom:0;width:10px;border-right:1px solid var(--line)}
  .article h3{font-family:var(--serif);font-size:19px;margin-bottom:10px}
  .article .src{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:14px;word-break:break-all}
  .article p{font-size:14px;line-height:1.8;color:#333a32;margin-bottom:12px}
  .article p mark{background:var(--highlight);padding:0 3px;border-radius:2px}

  .summary-block{margin-bottom:16px}
  .summary-block h4{font-family:var(--mono);font-size:11px;letter-spacing:.6px;color:var(--green);text-transform:uppercase;margin-bottom:8px}
  .summary-block p{font-size:14.5px;line-height:1.7}
  .points{margin:0;padding:0;list-style:none}
  .points li{
    position:relative;padding:9px 0 9px 26px;
    font-size:14px;line-height:1.6;border-bottom:1px dashed var(--line);
  }
  .points li:last-child{border-bottom:none}
  .points li::before{
    content:"→";position:absolute;left:2px;top:9px;color:var(--green);font-family:var(--mono);
  }
  .tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .tag{
    font-family:var(--mono);font-size:11px;
    padding:3px 9px;border-radius:5px;
    background:rgba(46,107,76,.09);color:var(--green-deep);
  }
  .result-actions{display:flex;gap:10px;margin-top:18px}

  /* ---------- Library view ---------- */
  .lib-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
  .search{
    flex:1;min-width:220px;display:flex;align-items:center;gap:8px;
    background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 12px;
  }
  .search svg{width:16px;height:16px;color:var(--muted);flex:none}
  .search input{flex:1;border:none;background:transparent;font-size:13.5px}
  .search input:focus{outline:none}
  .filters{display:flex;gap:7px;flex-wrap:wrap}
  .fchip{
    font-family:var(--mono);font-size:11.5px;padding:5px 11px;border-radius:20px;
    border:1px solid var(--line);color:var(--muted);transition:all .12s;
  }
  .fchip:hover{border-color:var(--muted);color:var(--ink)}
  .fchip.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .note-card{
    position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 18px 16px;box-shadow:var(--shadow);cursor:pointer;
    transition:transform .12s,box-shadow .12s,border-color .12s;
    background-image:repeating-linear-gradient(transparent 0 25px, rgba(32,38,31,.028) 25px 26px);
  }
  .note-card:hover{transform:translateY(-3px);box-shadow:0 4px 10px rgba(32,38,31,.08),0 14px 34px rgba(32,38,31,.09);border-color:var(--kraft)}
  .note-card .tab{
    position:absolute;top:-1px;right:18px;
    width:34px;height:8px;border-radius:0 0 4px 4px;background:var(--kraft);
  }
  .note-card .kind{font-family:var(--mono);font-size:10px;letter-spacing:.6px;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
  .note-card h3{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.35;margin-bottom:9px}
  .note-card .snippet{font-size:13px;color:var(--muted);line-height:1.65;margin-bottom:14px}
  .note-card .meta{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  .note-card .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}

  .empty{
    text-align:center;padding:70px 20px;color:var(--muted);
  }
  .empty .big{font-family:var(--serif);font-size:20px;color:var(--ink);margin-bottom:8px}
  .empty p{font-size:13.5px;line-height:1.6}

  /* ---------- Note detail ---------- */
  .note-layout{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
  @media (max-width:900px){.note-layout{grid-template-columns:1fr}}
  .note-doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 28px}
  .note-doc .meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:6px;word-break:break-all}
  .note-doc h2{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.3;margin-bottom:16px}
  .note-doc .body{font-size:15px;line-height:1.85;color:#333a32}
  .note-doc .body p{margin-bottom:14px}
  .note-doc .body h3{font-family:var(--serif);font-size:19px;margin:20px 0 10px}
  .note-doc .body ul{margin:0 0 14px 22px}
  .note-doc .body li{margin-bottom:7px}
  .note-doc .body mark{background:var(--highlight);padding:0 3px;border-radius:2px}
  .note-doc textarea{
    width:100%;min-height:420px;border:1px solid var(--line);border-radius:8px;
    padding:14px;font-size:14px;line-height:1.8;font-family:var(--sans);resize:vertical;
  }
  .note-doc textarea:focus{outline:2px solid var(--green);outline-offset:1px}

  .ask-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;height:100%;max-height:560px}
  .ask-panel .head{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .ask-panel .head .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.6px;color:var(--green);text-transform:uppercase}
  .thread{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:88%;padding:10px 13px;border-radius:10px;font-size:13.5px;line-height:1.6}
  .msg.user{align-self:flex-end;background:var(--green);color:#fff;border-bottom-right-radius:3px}
  .msg.ai{align-self:flex-start;background:#EFF1EA;border:1px solid var(--line);border-bottom-left-radius:3px}
  .msg.ai .cite{display:block;margin-top:6px;font-family:var(--mono);font-size:10.5px;color:var(--green-deep)}
  .typing{display:inline-flex;gap:3px;padding:4px 2px}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  .ask-input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
  .ask-input input{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:13.5px}
  .ask-input input:focus{outline:2px solid var(--green);outline-offset:0}
  .ask-input .send{background:var(--green);color:#fff;border-radius:8px;width:38px;height:38px;display:grid;place-items:center;flex:none}
  .ask-input .send:hover{background:var(--green-deep)}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:9px;
    font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.22);
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
  @media (max-width:720px){
    .app{grid-template-columns:1fr}
    .sidebar{flex-direction:row;align-items:center;gap:8px;padding:10px 12px;border-right:none;border-bottom:1px solid var(--line)}
    .brand{padding:0;border:none;margin:0 12px 0 0}
    .brand-sub{display:none}
    .nav{flex-direction:row;gap:4px}
    .nav-item .count{display:none}
    .sidebar-foot{display:none}
    .topbar{padding:12px 16px}
    .view{padding:16px}
  }
</style>
</head>
<body>
  <div class="app">
    <!-- ===================== Sidebar ===================== -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">R</div>
        <div>
          <div class="brand-name">RedNote</div>
          <div class="brand-sub">LOCAL STUDY NOTES</div>
        </div>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-view="collect">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
          <span>采集</span>
        </button>
        <button class="nav-item" data-view="library">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="13" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/></svg>
          <span>笔记库</span>
          <span class="count" id="noteCount">0</span>
        </button>
      </nav>
      <div class="sidebar-foot">
        <span class="dot"></span>本地存储 · 数据不出本机<br>
        笔记为 Markdown · 可导出备份
      </div>
    </aside>

    <!-- ===================== Main ===================== -->
    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="topTitle">采集</h1>
          <div class="crumb" id="topCrumb">粘贴链接 → 提炼 → 保存</div>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-ghost btn-sm" id="newCollectBtn" style="display:none">+ 采集新内容</button>
        </div>
      </header>

      <!-- ============ 采集 ============ -->
      <section class="view active" id="view-collect">
        <div class="collect-wrap">
          <div class="collect-hero">
            <div class="eyebrow">Capture → Distill → Keep</div>
            <h2>把网页里的知识，提炼成你自己的笔记</h2>
            <p>粘贴一篇文章的链接，Agent 会帮你读原文、提炼要点、打上标签。所有内容只保存在你的电脑上。</p>
          </div>

          <div class="urlbar">
            <input type="text" id="urlInput" placeholder="粘贴网页链接，例如 https://…" aria-label="网页链接">
            <button class="btn btn-primary" id="collectBtn">提炼</button>
          </div>
          <div class="examples">
            <button class="example-chip">example.com/transformer</button>
            <button class="example-chip">example.com/para-method</button>
            <button class="example-chip">example.com/learning-how-to-learn</button>
          </div>

          <div class="collect-stages" id="collectStages">
            <div class="stage" id="stage1">
              <div class="spinner"></div><div class="check">✓</div>
              <div><div class="t">正在读取网页正文…</div><div class="d" id="stage1d"></div></div>
            </div>
            <div class="stage" id="stage2">
              <div class="spinner"></div><div class="check">✓</div>
              <div><div class="t">Agent 正在提炼要点与摘要…</div><div class="d">云端模型处理中</div></div>
            </div>
            <div class="stage" id="stage3">
              <div class="spinner"></div><div class="check">✓</div>
              <div><div class="t">生成建议标签…</div><div class="d">知识管理 · 学习方法</div></div>
            </div>
          </div>

          <div class="collect-result" id="collectResult">
            <div class="result-grid">
              <div class="panel">
                <div class="panel-head"><span class="lbl">原文摘录</span><span class="lbl" style="text-transform:none">共 1,840 字</span></div>
                <div class="panel-body article" id="articleBody"></div>
              </div>
              <div class="panel">
                <div class="panel-head"><span class="lbl">Agent 提炼的笔记</span></div>
                <div class="panel-body">
                  <div class="summary-block">
                    <h4>摘要</h4>
                    <p id="draftSummary"></p>
                  </div>
                  <div class="summary-block">
                    <h4>要点</h4>
                    <ul class="points" id="draftPoints"></ul>
                  </div>
                  <div class="tag-row" id="draftTags"></div>
                  <div class="result-actions">
                    <button class="btn btn-primary" id="saveBtn">保存为笔记</button>
                    <button class="btn btn-ghost" id="redoCbtn">重新提炼</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- ============ 笔记库 ============ -->
      <section class="view" id="view-library">
        <div class="lib-tools">
          <div class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
            <input type="text" id="searchInput" placeholder="搜索标题、摘要或标签…" aria-label="搜索笔记">
          </div>
          <div class="filters" id="tagFilters"></div>
        </div>
        <div class="cards" id="cards"></div>
      </section>

      <!-- ============ 笔记详情 ============ -->
      <section class="view" id="view-note">
        <div class="note-layout">
          <div class="note-doc" id="noteDoc"></div>
          <div class="ask-panel">
            <div class="head"><span class="lbl">就这篇笔记追问</span></div>
            <div class="thread" id="thread"></div>
            <div class="ask-input">
              <input type="text" id="askInput" placeholder="例如：这篇的核心结论是什么？" aria-label="提问">
              <button class="send" id="askBtn" aria-label="发送">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';
  const $ = s => document.querySelector(s);
  const $$ = s => document.querySelectorAll(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  /* ---------------- Mock data ---------------- */
  const notes = [
    {
      id:'n1',
      title:'深入理解 Transformer 的注意力机制',
      summary:'用直觉拆解 Q / K / V 与多头注意力的计算过程，理解自注意力为何能捕捉长程依赖。',
      points:['Q、K、V 分别代表查询、键、值，注意力本质是「按相关性加权求和」','多头注意力让模型在不同子空间并行关注不同模式','位置编码弥补了自注意力对顺序不敏感的缺陷'],
      content:'# 一句话理解\n注意力机制回答一个问题：**在处理当前位置时，应该把注意力放在序列的哪些其他位置？**\n\n# 计算过程\n\n- 每个 token 生成三个向量：Query、Key、Value\n- 用当前 token 的 Q 与所有 token 的 K 做点积，得到相关度分数\n- 分数经 softmax 归一化后，作为权重对 V 加权求和\n\n# 为什么要多头\n单头注意力只能学到一种「关注模式」。多头并行计算多次注意力，相当于让模型同时从「语法」「指代」「语义」等不同角度去理解同一段文本，再把结果拼接起来。\n\n# 位置编码\n自注意力本身对词的顺序不敏感——打乱顺序，输出几乎不变。位置编码把「位置」信息注入输入，让模型知道谁在谁前面。',
      tags:['深度学习','注意力机制'],
      source:'distill.pub/2021/attention',
      date:'2026-08-28'
    },
    {
      id:'n2',
      title:'SQL 索引与查询优化实战',
      summary:'从 B+ 树结构出发，理解索引为何加速查询，以及什么情况下索引会失效。',
      points:['B+ 树索引擅长范围查询与有序遍历','复合索引遵循最左前缀原则','对索引列做函数运算会导致索引失效'],
      content:'# 索引为什么快\n没有索引时，数据库只能全表扫描。B+ 树把数据按顺序组织成一棵平衡树，查询从「遍历所有行」变成「沿着树向下查找」，复杂度从 O(n) 降到 O(log n)。\n\n# 最左前缀原则\n复合索引 (a, b, c) 相当于先按 a 排序，再按 b、再按 c。因此查询条件只用到了 a，索引能命中；只用 b 而不用 a，索引无法命中。\n\n# 索引失效的常见场景\n\n- 对索引列做运算或函数，例如 WHERE YEAR(created) = 2026\n- 隐式类型转换，例如字符串列与数字比较\n- LIKE 以通配符开头，例如 LIKE "%abc"\n\n# 经验\n不要为了优化而盲目加索引，索引会拖慢写入。先看执行计划，再决定建不建。',
      tags:['数据库','性能优化'],
      source:'use-the-index-luke.com',
      date:'2026-08-25'
    },
    {
      id:'n3',
      title:'费曼技巧：用输出倒逼理解',
      summary:'用「讲给外行听」的方式检验自己是否真正掌握，暴露知识盲区。',
      points:['能用简单语言讲清楚，才说明真的懂了','卡壳的地方就是需要回炉重学的地方','用类比和例子替代术语，检验理解深度'],
      content:'# 核心做法\n拿一张白纸，写下要理解的概念，然后**假装讲给一个完全不懂的人听**，用大白话解释清楚。\n\n# 为什么有效\n人在阅读时容易产生「熟悉感错觉」——看懂了不等于能讲出来。强迫自己输出，会立刻暴露哪些地方其实没想明白。\n\n# 三步循环\n\n- 讲解：用自己的话把概念讲出来\n- 卡壳：讲不下去的地方，标记为盲区\n- 回炉：回到原始材料，只补那个盲区，再重新讲\n\n# 收尾\n讲完之后，试着简化语言、替换成生活化的类比。如果连类比都做不出来，说明理解还停留在表面。',
      tags:['学习方法','元认知'],
      source:'fs.blog/feynman-technique',
      date:'2026-08-20'
    }
  ];

  const mockDraft = {
    title:'构建你的第二大脑：PARA 方法实践指南',
    summary:'PARA 用「行动性」而非主题来组织信息，把笔记分成项目、领域、资源、存档四类，让知识随行动流动。',
    points:['四类划分：Project（有目标与截止）、Area（持续维护）、Resource（兴趣储备）、Archive（暂时不用）','分类标准是「这条信息能帮我现在做什么」，而不是「它关于什么」','每周用 30 分钟复盘，把完成的项目和冷落的内容移入存档，保持系统轻量'],
    tags:['知识管理','第二大脑','PARA'],
    article:[
      '我们收藏了太多东西，却很少真正用到它们。PARA 方法的出发点很简单：**让信息围绕「行动」来组织，而不是围绕「主题」来堆砌。**',
      'P（Projects）是有明确目标和截止时间的事，A（Areas）是需要长期维护的领域，R（Resources）是感兴趣、可能用到的储备，Archive 则是暂时搁置的内容。一条笔记放在哪，取决于它此刻能推动你做什么。',
      '这个系统不是一次搭好就一劳永逸的。它需要你**每周花一点时间复盘**：项目完成了就归档，领域冷落了就合并，资源长期没碰就清理。保持轻量，知识才会流动起来。'
    ]
  };

  /* ---------------- State ---------------- */
  let currentView = 'collect';
  let activeTag = '全部';
  let draft = null;
  let activeNoteId = null;

  const VIEW_META = {
    collect:{title:'采集', crumb:'粘贴链接 → 提炼 → 保存'},
    library:{title:'笔记库', crumb:'搜索 · 筛选 · 打开'},
    note:{title:'笔记详情', crumb:'阅读 · 编辑 · 追问'}
  };

  /* ---------------- Navigation ---------------- */
  function showView(name){
    currentView = name;
    $$('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === name));
    $$('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
    const m = VIEW_META[name];
    $('#topTitle').textContent = m.title;
    $('#topCrumb').textContent = m.crumb;
    $('#newCollectBtn').style.display = (name === 'library') ? '' : 'none';
    if(name === 'library') renderLibrary();
    if(name === 'note' && activeNoteId) renderNote();
  }
  $$('.nav-item').forEach(b => b.addEventListener('click', () => showView(b.dataset.view)));
  $('#newCollectBtn').addEventListener('click', () => showView('collect'));

  /* ---------------- Toast ---------------- */
  let toastTimer;
  function toast(msg){
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  /* ---------------- Collect ---------------- */
  const urlInput = $('#urlInput');
  $$('.example-chip').forEach(c => c.addEventListener('click', () => { urlInput.value = c.textContent; }));

  async function handleCollect(){
    const url = urlInput.value.trim();
    if(!url){ urlInput.focus(); toast('请先粘贴一个网页链接'); return; }

    // reset
    $('#collectStages').classList.add('visible');
    $('#collectResult').classList.remove('visible');
    $$('.stage').forEach(s => s.classList.remove('done'));
    $('#collectBtn').disabled = true;
    $('#stage1d').textContent = url;

    await sleep(900);
    $('#stage1').classList.add('done');
    await sleep(1100);
    $('#stage2').classList.add('done');
    await sleep(900);
    $('#stage3').classList.add('done');
    await sleep(350);

    draft = Object.assign({}, mockDraft, { source:url });
    renderDraft();
    $('#collectResult').classList.add('visible');
    $('#collectBtn').disabled = false;
    $('#collectResult').scrollIntoView({behavior:'smooth', block:'start'});
  }
  $('#collectBtn').addEventListener('click', handleCollect);
  urlInput.addEventListener('keydown', e => { if(e.key === 'Enter') handleCollect(); });

  function renderDraft(){
    $('#articleBody').innerHTML =
      '<h3>' + esc(draft.title) + '</h3>' +
      '<div class="src">来源：' + esc(draft.source) + '</div>' +
      draft.article.map(p => '<p>' + inline(p) + '</p>').join('');
    $('#draftSummary').textContent = draft.summary;
    $('#draftPoints').innerHTML = draft.points.map(p => '<li>' + esc(p) + '</li>').join('');
    $('#draftTags').innerHTML = draft.tags.map(t => '<span class="tag">' + esc(t) + '</span>').join('');
  }

  function saveDraft(){
    if(!draft) return;
    const note = {
      id:'n' + Date.now(),
      title:draft.title, summary:draft.summary, points:draft.points,
      content:draft.article.join('\n\n'),
      tags:draft.tags.slice(), source:draft.source, date:today()
    };
    notes.unshift(note);
    activeNoteId = note.id;
    toast('已保存到笔记库');
    showView('library');
  }
  $('#saveBtn').addEventListener('click', saveDraft);
  $('#redoCbtn').addEventListener('click', () => {
    draft = null;
    $('#collectResult').classList.remove('visible');
    $('#collectStages').classList.remove('visible');
    urlInput.value = ''; urlInput.focus();
  });

  /* ---------------- Library ---------------- */
  function allTags(){
    const set = new Set();
    notes.forEach(n => n.tags.forEach(t => set.add(t)));
    return Array.from(set);
  }
  function renderFilters(){
    const tags = ['全部'].concat(allTags());
    $('#tagFilters').innerHTML = tags.map(t =>
      '<button class="fchip' + (t === activeTag ? ' active' : '') + '" data-tag="' + esc(t) + '">' + esc(t) + '</button>'
    ).join('');
    $$('#tagFilters .fchip').forEach(c => c.addEventListener('click', () => { activeTag = c.dataset.tag; renderFilters(); renderLibrary(); }));
  }
  function renderLibrary(){
    const q = $('#searchInput').value.trim().toLowerCase();
    const list = notes.filter(n => {
      const okTag = activeTag === '全部' || n.tags.includes(activeTag);
      const hay = (n.title + ' ' + n.summary + ' ' + n.tags.join(' ')).toLowerCase();
      return okTag && (!q || hay.includes(q));
    });
    $('#noteCount').textContent = notes.length;
    if(list.length === 0){
      $('#cards').innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="big">没有匹配的笔记</div><p>换个关键词，或去「采集」页新增一篇。</p></div>';
      return;
    }
    $('#cards').innerHTML = list.map(n =>
      '<article class="note-card" data-id="' + n.id + '">' +
        '<div class="tab"></div>' +
        '<div class="kind">笔记 · ' + esc(n.date) + '</div>' +
        '<h3>' + esc(n.title) + '</h3>' +
        '<div class="snippet">' + esc(n.summary) + '</div>' +
        '<div class="tags">' + n.tags.map(t => '<span class="tag">' + esc(t) + '</span>').join('') + '</div>' +
        '<div class="meta"><span>' + esc(n.source) + '</span><span>' + n.points.length + ' 要点</span></div>' +
      '</article>'
    ).join('');
    $$('.note-card').forEach(c => c.addEventListener('click', () => { activeNoteId = c.dataset.id; showView('note'); }));
  }
  $('#searchInput').addEventListener('input', renderLibrary);

  /* ---------------- Note detail ---------------- */
  let editing = false;
  function renderNote(){
    const n = notes.find(x => x.id === activeNoteId);
    if(!n){ showView('library'); return; }
    $('#topCrumb').textContent = '来源：' + n.source;
    const tags = n.tags.map(t => '<span class="tag">' + esc(t) + '</span>').join('');
    $('#noteDoc').innerHTML =
      '<div class="meta">' + esc(n.date) + ' 保存 · ' + esc(n.source) + '</div>' +
      '<h2>' + esc(n.title) + '</h2>' +
      '<div class="tag-row" style="margin:0 0 16px">' + tags + '</div>' +
      '<div id="noteBody">' + renderMarkdown(n.content) + '</div>' +
      '<div style="margin-top:18px;display:flex;gap:10px">' +
        '<button class="btn btn-ghost btn-sm" id="editToggle">' + (editing ? '完成编辑' : '编辑') + '</button>' +
      '</div>';
    $('#editToggle').addEventListener('click', toggleEdit);
    // reset thread with a starter
    $('#thread').innerHTML =
      '<div class="msg ai">我可以基于这篇笔记回答你的问题。试试问我「这篇的核心结论是什么？」<span class="cite">基于本地笔记 · ' + esc(n.title) + '</span></div>';
    $('#askInput').value = '';
  }
  function toggleEdit(){
    editing = !editing;
    renderNote();
    if(editing){
      const n = notes.find(x => x.id === activeNoteId);
      const ta = document.createElement('textarea');
      ta.value = n.content;
      ta.addEventListener('input', e => { n.content = e.target.value; });
      const body = $('#noteBody');
      body.replaceWith(ta);
    }
  }
  $('#askBtn').addEventListener('click', ask);
  $('#askInput').addEventListener('keydown', e => { if(e.key === 'Enter') ask(); });

  function ask(){
    const q = $('#askInput').value.trim();
    if(!q) return;
    const n = notes.find(x => x.id === activeNoteId);
    const thread = $('#thread');
    thread.insertAdjacentHTML('beforeend', '<div class="msg user">' + esc(q) + '</div>');
    $('#askInput').value = '';
    thread.insertAdjacentHTML('beforeend', '<div class="msg ai"><span class="typing"><span></span><span></span><span></span></span></div>');
    thread.scrollTop = thread.scrollHeight;

    setTimeout(() => {
      const typing = thread.querySelector('.typing');
      if(typing){
        typing.closest('.msg').outerHTML = '<div class="msg ai">' + mockAnswer(n, q) +
          '<span class="cite">基于本地笔记 · ' + esc(n.title) + '</span></div>';
      }
      thread.scrollTop = thread.scrollHeight;
    }, 1000);
  }
  function mockAnswer(n, q){
    const k1 = n.points[0] || '核心要点';
    const k2 = n.points[1] || '';
    if(/核心|结论|总结|主要/.test(q)){
      return '这篇笔记的核心结论是：' + esc(k1) + (k2 ? '；其次，' + esc(k2) + '。' : '。');
    }
    if(/例子|举例|类比/.test(q)){
      return '可以用一个类比来理解：' + esc(n.title) + ' 就像把「' + esc(k1) + '」这件事，用一个更直观的场景讲清楚——这样检验自己是不是真的懂了。';
    }
    return '这篇笔记里有相关的内容：' + esc(k1) + (k2 ? '。另外还提到了「' + esc(k2) + '」。' : '。') + ' 你可以顺着这个方向继续追问。';
  }

  /* ---------------- Markdown helpers ---------------- */
  function renderMarkdown(text){
    return text.split('\n\n').map(block => {
      const b = block.trim();
      if(b.startsWith('# ')) return '<h3>' + inline(b.slice(2)) + '</h3>';
      if(b.startsWith('- ')){
        const items = b.split('\n').filter(l => l.trim().startsWith('- ')).map(l => '<li>' + inline(l.trim().slice(2)) + '</li>').join('');
        return '<ul>' + items + '</ul>';
      }
      return '<p>' + inline(b) + '</p>';
    }).join('');
  }
  function inline(t){
    return esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<mark>$1</mark>');
  }
  function today(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  /* ---------------- Init ---------------- */
  renderFilters();
  renderLibrary();
})();
</script>
</body>
</html>
